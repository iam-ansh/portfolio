name: Deploy to S3
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
        env:
          VITE_GITHUB_USER: ${{ vars.VITE_GITHUB_USER }}
          VITE_EMAIL: ${{ vars.VITE_EMAIL }}
          VITE_LINKEDIN_HANDLE: ${{ vars.VITE_LINKEDIN_HANDLE }}
          VITE_LINKEDIN_CONNECTIONS: ${{ vars.VITE_LINKEDIN_CONNECTIONS }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: aws s3 sync dist/ s3://${{ vars.S3_BUCKET }} --delete