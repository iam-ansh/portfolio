<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page not found</title>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root { --bg:#0b0d1f; --ink:#eef0ff; --muted:#a3a9d6; --accent:#8b7bff; --hot:#ff6b9d; }
        @media (prefers-color-scheme: light) {
            :root { --bg:#f6f4ff; --ink:#172033; --muted:#55607a; --accent:#5b3df5; --hot:#ff3d7f; }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem;
            background: radial-gradient(50rem 35rem at 85% -10%, color-mix(in srgb, var(--accent) 25%, transparent), transparent), var(--bg);
            color: var(--ink); font: 400 1.0625rem/1.6 "IBM Plex Sans", system-ui, sans-serif; text-align: center;
        }
        .code {
            margin: 0; font: 800 clamp(5rem, 24vw, 10rem)/1 "Bricolage Grotesque", system-ui, sans-serif;
            background: linear-gradient(90deg, var(--accent), var(--hot), var(--accent)); background-size: 200% 100%;
            -webkit-background-clip: text; background-clip: text; color: transparent;
            animation: shift 6s linear infinite;
        }
        h1 { margin: .5rem 0; font: 700 1.75rem/1.2 "Bricolage Grotesque", system-ui, sans-serif; }
        p { margin: 0 0 1.75rem; color: var(--muted); }
        .btn {
            display: inline-block; padding: .75rem 1.5rem; border-radius: 6px; color: #fff; text-decoration: none; font-weight: 500;
            background: linear-gradient(135deg, var(--accent), var(--hot)); transition: transform .2s;
        }
        .btn:hover { transform: translateY(-3px); }
        .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
        @keyframes shift { to { background-position: -200% 0; } }
        @media (prefers-reduced-motion: reduce) { .code { animation: none; } .btn { transition: none; } }
    </style>
</head>
<body>
<main>
    <p class="code" aria-hidden="true">404</p>
    <h1>Page not found</h1>
    <p>The link may be broken, or the page may have moved.</p>
    <a class="btn" href="/">Back to home</a>
</main>
</body>
</html>
